name: CI
permissions: {}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (rust)
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dprint
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --all-features
          cargo doc --no-deps --all-features --document-private-items

      - name: rustfmt Check
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2

  lint-python:
    runs-on: ubuntu-latest
    name: Lint (python)
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools
    env:
      # the versions are locked in tools/uv.lock, which dependabot updates
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check

      - name: pyrefly
        run: uv run pyrefly check

  msrv:
    runs-on: ubuntu-latest
    name: MSRV
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: read rust-version from Cargo.toml
        id: msrv
        run: >-
          echo "msrv=$(cargo metadata --no-deps --format-version=1
          | jq -r '.packages[] | select(.name == "xsf") | .rust_version')"
          >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: cargo check
        run: cargo check

  package:
    runs-on: ubuntu-latest
    name: Package
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo package
        run: cargo package

  test:
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}${{ matrix.profile == 'release' && ', release' || '' }})
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [dev]
        include:
          # docs/accuracy.md is measured in release, and some results differ from debug builds
          - os: ubuntu-latest
            profile: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.profile }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo test
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: cargo test --verbose --profile "$PROFILE" -- --nocapture

      - name: cargo test (table reader)
        run: cargo test --manifest-path testing/Cargo.toml
