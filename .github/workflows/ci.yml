name: CI
permissions: {}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (rust)
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: dprint
        uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --all-features
          cargo doc --no-deps --all-features --document-private-items

      - name: rustfmt Check
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2

  lint-python:
    runs-on: ubuntu-latest
    name: Lint (python)
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: ruff check
        run: uvx ruff@0.17.3 check tools

      - name: ruff format
        run: uvx ruff@0.17.3 format --check tools

      - name: basedpyright
        run: uvx --with mpmath==1.4.1 basedpyright@1.40.2 -p tools

  msrv:
    runs-on: ubuntu-latest
    name: MSRV
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: read rust-version from Cargo.toml
        id: msrv
        run: >-
          echo "msrv=$(cargo metadata --no-deps --format-version=1
          | jq -r '.packages[] | select(.name == "xsf") | .rust_version')"
          >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: cargo check
        run: cargo check

  package:
    runs-on: ubuntu-latest
    name: Package
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: cargo package
        run: cargo package

  test:
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }})
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo test
        run: cargo test --verbose -- --nocapture
