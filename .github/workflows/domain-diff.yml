name: domain-diff
permissions: {}

# (no path filter: GitHub filters the files of the PR, not those of the merge commit)
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  domain-diff:
    runs-on: ubuntu-latest
    name: Accuracy over whole domains
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read # the labels of the PR
    env:
      # the versions are locked in tools/uv.lock, which dependabot updates
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the merge commit and its first parent, the base tip
          fetch-depth: 2
          persist-credentials: false

      - id: src
        run: git diff --quiet HEAD^1 HEAD -- src || echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.src.outputs.changed
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: tools/accuracy
          # (the lint job checks the warnings)
          build-warnings: warn

      - if: steps.src.outputs.changed
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - if: steps.src.outputs.changed
        run: uv sync --project tools

      # the references are keyed by their input and sources, so a stale file is only unused
      - if: steps.src.outputs.changed
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/accuracy/.cache/domain-diff
          key: domain-diff-${{ github.run_id }}
          restore-keys: domain-diff-

      # Compares the merge commit with the base tip for the functions that depend on the changed
      # files of src/. Exit code 1 is a regression. Exit code 2 is a comparison that could not be
      # made (e.g. a new function, which the base lacks, or a missing reference), which only warns.
      # Exit code 3 is a function that got slower, which fails unless the PR has the label
      # `allow-slowdown`; re-run the job after adding or removing it (a label event starts no run).
      # Its last line tells these from a failure of the script itself (e.g. a build error).
      - if: steps.src.outputs.changed
        name: domain-diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=0
          uv run --project tools tools/accuracy/domain_diff.py \
            --base HEAD^1 --affected --max-inputs 2097152 > "$RUNNER_TEMP/table.md" || code=$?
          cat "$RUNNER_TEMP/table.md"
          {
            echo "## Accuracy over whole domains"
            cat "$RUNNER_TEMP/table.md"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code:$(tail -n 1 "$RUNNER_TEMP/table.md")" in
            0:*) ;;
            1:*FAIL)
              echo "::error::A function got less accurate over a domain (see the job summary and the artifact domain-diff)"
              ;;
            2:*INCONCLUSIVE) echo "::warning::The comparison is incomplete (see the job summary)" ;;
            3:*SLOW)
              # not from the event, whose labels are those from when the run started
              if ! labels=$(gh pr view "$PR" --json labels --jq '.labels[].name'); then
                echo "::error::The labels of the PR could not be read"
                code=1
              elif grep -qx allow-slowdown <<< "$labels"; then
                echo "::warning::A function got slower (see the job summary); allowed by the label allow-slowdown"
              else
                echo "::error::A function got slower (see the job summary); add the label allow-slowdown and re-run the job if that is intended"
                code=1
              fi
              ;;
            *)
              echo "::error::domain_diff.py failed with exit code $code"
              code=1
              ;;
          esac
          [ "$code" = 0 ] || [ "$code" = 2 ] || [ "$code" = 3 ]

      # (only with new references; the cache of a PR is not read by other PRs)
      - id: key
        if: always() && steps.src.outputs.changed
        run: |
          if [ -d tools/accuracy/.cache/domain-diff ]; then
            hash=$(find tools/accuracy/.cache/domain-diff -name "*.json" -print0 | sort -z |
              xargs -0r sha256sum | sha256sum | cut -c1-16)
            echo "key=domain-diff-$hash" >> "$GITHUB_OUTPUT"
          fi

      - if: always() && steps.key.outputs.key && steps.key.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/accuracy/.cache/domain-diff
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.src.outputs.changed
        with:
          name: domain-diff
          path: tools/accuracy/.cache/domain-diff.tsv
          if-no-files-found: ignore
