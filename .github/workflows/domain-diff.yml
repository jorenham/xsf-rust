name: domain-diff
permissions: {}

on:
  pull_request:
    paths:
      - "src/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  domain-diff:
    runs-on: ubuntu-latest
    name: Accuracy over whole domains
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # the versions are locked in tools/uv.lock, which dependabot updates
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the merge commit and its first parent, the base tip
          fetch-depth: 2
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: tools/accuracy

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # the references are keyed by their input and sources, so a stale file is only unused
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/accuracy/.cache/domain-diff
          key: domain-diff-${{ github.run_id }}
          restore-keys: domain-diff-

      # Compares the merge commit with the base tip for the functions that depend on the changed
      # files of src/. Exit code 1 is a regression. Exit code 2 is a comparison that could not be
      # made (e.g. a new function, which the base lacks, or a missing reference), which only warns.
      - name: domain-diff
        run: |
          code=0
          uv run --project tools tools/accuracy/domain_diff.py \
            --base HEAD^1 --affected --max-inputs 2097152 > "$RUNNER_TEMP/table.md" || code=$?
          cat "$RUNNER_TEMP/table.md"
          {
            echo "## Accuracy over whole domains"
            cat "$RUNNER_TEMP/table.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 1 ]; then
            echo "::error::A function got less accurate over a domain (see the job summary and the artifact domain-diff)"
          elif [ "$code" = 2 ]; then
            echo "::warning::The comparison is incomplete (see the job summary)"
          elif [ "$code" != 0 ]; then
            echo "::error::domain_diff.py failed with exit code $code"
          fi
          [ "$code" = 0 ] || [ "$code" = 2 ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domain-diff
          path: tools/accuracy/.cache/domain-diff.tsv
          if-no-files-found: ignore
