[package]
name = "xsf"
version = "0.6.0+0.2.2"
authors = ["Joren Hammudoglu <jhammudoglu@gmail.com>"]
categories = ["mathematics", "science"]
edition = "2024"
include = ["*.rs", "katex.html"]
keywords = ["math", "special-functions", "xsf", "scipy"]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/jorenham/xsf-rust"
rust-version = "1.85"
description = "Pure Rust implementations of scipy.special functions."

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex.html"]

[dependencies]
num-complex = "0.4.6"
num-traits = "0.2.19"

[dev-dependencies]
xsref = { path = "testing" }
