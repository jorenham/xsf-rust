[package]
name = "xsf"
version = "0.6.0+0.2.2"
authors = ["Joren Hammudoglu <jhammudoglu@gmail.com>"]
categories = ["api-bindings", "mathematics", "science"]
edition = "2024"
include = [
  "*.rs",
  "katex.html",
  "xsf/include",
  # headers that are no longer (transitively) included by build.rs
  "!xsf/include/xsf/alg.h",
  "!xsf/include/xsf/beta.h",
  "!xsf/include/xsf/binom.h",
  "!xsf/include/xsf/cdflib.h",
  "!xsf/include/xsf/cephes/bdtr.h",
  "!xsf/include/xsf/cephes/beta.h",
  "!xsf/include/xsf/cephes/chdtr.h",
  "!xsf/include/xsf/cephes/dd_real.h",
  "!xsf/include/xsf/cephes/ellie.h",
  "!xsf/include/xsf/cephes/ellik.h",
  "!xsf/include/xsf/cephes/ellpe.h",
  "!xsf/include/xsf/cephes/ellpj.h",
  "!xsf/include/xsf/cephes/ellpk.h",
  "!xsf/include/xsf/cephes/erfinv.h",
  "!xsf/include/xsf/cephes/exp10.h",
  "!xsf/include/xsf/cephes/exp2.h",
  "!xsf/include/xsf/cephes/expn.h",
  "!xsf/include/xsf/cephes/fdtr.h",
  "!xsf/include/xsf/cephes/fresnl.h",
  "!xsf/include/xsf/cephes/gdtr.h",
  "!xsf/include/xsf/cephes/hyp2f1.h",
  "!xsf/include/xsf/cephes/hyperg.h",
  "!xsf/include/xsf/cephes/incbet.h",
  "!xsf/include/xsf/cephes/incbi.h",
  "!xsf/include/xsf/cephes/kn.h",
  "!xsf/include/xsf/cephes/kolmogorov.h",
  "!xsf/include/xsf/cephes/nbdtr.h",
  "!xsf/include/xsf/cephes/ndtri.h",
  "!xsf/include/xsf/cephes/owens_t.h",
  "!xsf/include/xsf/cephes/pdtr.h",
  "!xsf/include/xsf/cephes/poch.h",
  "!xsf/include/xsf/cephes/psi.h",
  "!xsf/include/xsf/cephes/round.h",
  "!xsf/include/xsf/cephes/shichi.h",
  "!xsf/include/xsf/cephes/sici.h",
  "!xsf/include/xsf/cephes/spence.h",
  "!xsf/include/xsf/cephes/struve.h",
  "!xsf/include/xsf/cephes/tukey.h",
  "!xsf/include/xsf/cephes/zetac.h",
  "!xsf/include/xsf/digamma.h",
  "!xsf/include/xsf/dual.h",
  "!xsf/include/xsf/ellip.h",
  "!xsf/include/xsf/erf.h",
  "!xsf/include/xsf/exp.h",
  "!xsf/include/xsf/expint.h",
  "!xsf/include/xsf/faddeeva.h",
  "!xsf/include/xsf/fp_error_metrics.h",
  "!xsf/include/xsf/fresnel.h",
  "!xsf/include/xsf/hyp2f1.h",
  "!xsf/include/xsf/iv_ratio.h",
  "!xsf/include/xsf/kelvin.h",
  "!xsf/include/xsf/lambertw.h",
  "!xsf/include/xsf/legendre.h",
  "!xsf/include/xsf/log.h",
  "!xsf/include/xsf/log_exp.h",
  "!xsf/include/xsf/numbers.h",
  "!xsf/include/xsf/numpy.h",
  "!xsf/include/xsf/par_cyl.h",
  "!xsf/include/xsf/recur.h",
  "!xsf/include/xsf/sici.h",
  "!xsf/include/xsf/sph_bessel.h",
  "!xsf/include/xsf/sph_harm.h",
  "!xsf/include/xsf/stats.h",
  "!xsf/include/xsf/struve.h",
  "!xsf/include/xsf/third_party/kokkos/mdspan.hpp",
  "!xsf/include/xsf/tools.h",
  "!xsf/include/xsf/wright_bessel.h",
  "!xsf/include/xsf/zeta.h",
]
keywords = ["ffi", "bindings", "math", "xsf", "scipy"]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/jorenham/xsf-rust"
rust-version = "1.85"
description = "Rust implementations and bindings for scipy.special functions."

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex.html"]

[dependencies]
num-complex = "0.4.6"
num-traits = "0.2.19"

[build-dependencies]
cc = "1.7.0"

[dev-dependencies]
xsref = { path = "testing" }
